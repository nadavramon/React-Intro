# UNVERIFIED ASSUMPTIONS — these must ALL be true on the EC2 box before this
# workflow is safe to run. The SSM command below (git pull + pnpm build +
# systemctl restart) fails or silently deploys the wrong thing otherwise:
#   1. The box's git checkout is re-pointed at the React-Intro MONOREPO remote
#      (it previously tracked the standalone server repo). `git pull --ff-only`
#      must fetch this monorepo, not the old polyrepo.
#   2. The repo lives at /opt/app on the box. If it lives elsewhere, edit the
#      `cd /opt/app` path in the SSM command below.
#   3. Node 24 + corepack/pnpm are installed on the box (corepack enable +
#      pnpm install --frozen-lockfile + pnpm turbo run build must all resolve).
#   4. The systemd `server` unit's ExecStart runs
#      `node apps/server/dist/index.js` with WorkingDirectory at the repo root
#      (so `apps/web/dist` resolves relative to the compiled server file).
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build workspace + restart on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::825765398865:role/github-deploy
          aws-region: eu-central-1
      - name: Build + restart via SSM
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-050b3d01b5fbd58fa \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["cd /opt/app && git pull --ff-only && corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build && systemctl restart server"]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for command to finish
        run: |
          aws ssm wait command-executed --command-id "${{ steps.send.outputs.command_id }}" --instance-id i-050b3d01b5fbd58fa
          STATUS=$(aws ssm get-command-invocation --command-id "${{ steps.send.outputs.command_id }}" --instance-id i-050b3d01b5fbd58fa --query 'Status' --output text)
          echo "Final status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "${{ steps.send.outputs.command_id }}" --instance-id i-050b3d01b5fbd58fa
            exit 1
          fi
